<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETIKETKA GP | X-RAY VISION</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #FF3300; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* 3D Background */
        canvas { 
            position: fixed; 
            top: 0; left: 0; 
            z-index: 1; /* Об'єкт ПІД текстом */
            pointer-events: none; 
        }
        
        .cursor {
            position: fixed; width: 10px; height: 10px; background: #fff;
            border-radius: 50%; pointer-events: none; z-index: 9999;
            mix-blend-mode: difference; transition: transform 0.1s;
        }

        /* Головний екран */
        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10; /* Текст НАД об'єктом */
        }

        .hero-container {
            text-align: center;
            pointer-events: none; /* Щоб ми могли взаємодіяти з 3D крізь текст */
        }

        .hero-title {
            font-size: clamp(4rem, 18vw, 15rem);
            line-height: 0.8;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.06em;
            color: #fff;
            /* ОСНОВНА МАГІЯ: текст інвертує кольори того, що під ним */
            mix-blend-mode: difference; 
        }

        .hero-sub {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8em;
            margin-top: 2rem;
            opacity: 0.8;
            mix-blend-mode: difference;
        }

        /* Bento Grid Restored */
        .bento-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 20;
        }
        .bento-card:hover { border-color: var(--accent); transform: translateY(-10px); }

        .contact-link-main {
            font-size: clamp(2rem, 5vw, 6rem);
            font-weight: 900;
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            color: transparent;
            transition: all 0.5s ease;
        }
        .contact-link-main:hover { -webkit-text-stroke: 1px #fff; color: white; }

        .nav {
            position: fixed; top: 0; width: 100%; padding: 2rem;
            display: flex; justify-content: space-between; z-index: 100;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <canvas id="webgl"></canvas>

    <nav class="nav">
        <div class="font-black text-xl tracking-tighter">GP<span class="text-accent">.</span></div>
        <div class="text-[10px] uppercase tracking-[0.4em] font-bold">Kyiv Syndicate</div>
    </nav>

    <main>
        <section class="hero-section">
            <div class="hero-container">
                <h1 class="hero-title">ETIKETKA</h1>
                <h1 class="hero-title">GP<span class="text-accent">.</span></h1>
                <p class="hero-sub">Architects of Tactility</p>
            </div>
        </section>

        <section class="min-h-screen flex items-center px-10 relative z-20">
             <div class="max-w-4xl">
                 <h2 class="text-6xl font-black uppercase mb-10 leading-none">Більше ніж <br><span class="text-accent">друк.</span></h2>
                 <p class="text-xl text-white/40 leading-relaxed max-w-2xl">Ми працюємо на межі цифрового дизайну та фізичного матеріалу. Наступний блок буде про наші кейси.</p>
             </div>
        </section>

        <section id="contacts" class="py-32 px-6 relative z-20">
            <div class="w-full max-w-6xl mx-auto">
                <div class="mb-24 text-center">
                    <a href="mailto:etiketagp@gmail.com" class="contact-link-main uppercase break-all">
                        etiketagp@gmail.com
                    </a>
                </div>

                <div class="grid grid-cols-12 gap-6">
                    <a href="tel:0632686842" class="bento-card col-span-12 md:col-span-5 min-h-[300px]">
                        <span class="text-[10px] uppercase opacity-30 tracking-widest">Call Node</span>
                        <div class="text-4xl font-black mt-auto">063 268 68 42</div>
                    </a>
                    <div class="bento-card col-span-12 md:col-span-7 min-h-[300px]">
                        <span class="text-[10px] uppercase opacity-30 tracking-widest">Messengers</span>
                        <div class="flex gap-4 mt-auto">
                            <a href="#" class="flex-1 py-4 bg-white/5 hover:bg-white hover:text-black rounded-xl text-center text-xs font-bold transition-all">TELEGRAM</a>
                            <a href="#" class="flex-1 py-4 bg-white/5 hover:bg-white hover:text-black rounded-xl text-center text-xs font-bold transition-all">VIBER</a>
                        </div>
                    </div>
                    <div class="bento-card col-span-12 min-h-[200px]">
                        <span class="text-[10px] uppercase opacity-30 tracking-widest">HQ Location</span>
                        <div class="text-3xl font-black mt-auto">KYIV, UKRAINE</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uTime;
        uniform vec2 uMouse;

        void main() {
            vNormal = normal;
            vec3 pos = position;
            float noise = sin(pos.x * 2.0 + uTime) * cos(pos.y * 2.0 + uTime) * 0.25;
            pos += normal * noise;
            
            float dist = distance(uMouse, pos.xy * 0.2);
            if(dist < 1.2) {
                pos += normal * (1.2 - dist) * 0.6;
            }

            vPosition = pos;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uTime;

        void main() {
            vec3 viewDirection = normalize(vec3(0, 0, 5) - vPosition);
            float fresnel = pow(1.0 - dot(viewDirection, vNormal), 3.0);
            
            // Насичений помаранчевий
            vec3 color = mix(vec3(0.01), vec3(1.0, 0.2, 0.0), fresnel);
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        // 1. Lenis Smooth Scroll
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        // 2. Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#webgl'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const geometry = new THREE.IcosahedronGeometry(2.3, 64);
        const material = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0, 0) }
            }
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        camera.position.z = 5;

        // Mouse Tracker
        window.addEventListener('mousemove', (e) => {
            const mx = (e.clientX / window.innerWidth) * 2 - 1;
            const my = -(e.clientY / window.innerHeight) * 2 + 1;
            gsap.to(material.uniforms.uMouse.value, { x: mx * 2, y: my * 2, duration: 0.5 });
            gsap.to('#cursor', { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // 3. Loop
        const clock = new THREE.Clock();
        function animate() {
            const elapsedTime = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsedTime;
            
            mesh.rotation.y = elapsedTime * 0.2;
            
            // Паралакс
            const scrollY = window.scrollY;
            mesh.position.y = -scrollY * 0.005;
            mesh.rotation.z = scrollY * 0.001;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
