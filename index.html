<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETIKETKA GP | REPAIRED ENGINE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #FF3300; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        body { background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }

        /* Сцена WebGL (Найнижчий шар) */
        #webgl { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        /* ШАР ХМАР (Середній шар) */
        .cloud-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none; overflow: hidden;
            filter: blur(80px); /* Сильний блюр для м'якості */
        }

        .blob {
            position: absolute; border-radius: 50%; opacity: 0.6;
            will-change: transform;
        }
        .blob-1 { width: 40vw; height: 40vw; background: var(--accent); top: 20%; left: 10%; }
        .blob-2 { width: 35vw; height: 35vw; background: #fff; top: 40%; left: 50%; opacity: 0.3; }
        .blob-3 { width: 50vw; height: 50vw; background: #3300ff; bottom: -10%; right: 10%; opacity: 0.2; }

        /* ШАР ТЕКСТУ (Верхній шар) */
        .hero {
            position: relative; height: 100vh; width: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 3; /* НАД хмарами і ПІД курсором */
        }

        .hero-title {
            font-size: clamp(4rem, 16vw, 14rem);
            line-height: 0.8; font-weight: 900; text-transform: uppercase;
            letter-spacing: -0.06em; text-align: center;
            color: white;
            mix-blend-mode: difference; /* ГОЛОВНА МАГІЯ ТУТ */
            pointer-events: none;
        }

        .cursor {
            position: fixed; width: 12px; height: 12px; background: #fff;
            border-radius: 50%; pointer-events: none; z-index: 9999;
            mix-blend-mode: difference;
        }

        /* Bento Grid Restored */
        .bento-section { position: relative; z-index: 10; padding: 100px 20px; background: #000; }
        .bento-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 40px; min-height: 300px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.4s ease;
        }
        .bento-card:hover { border-color: var(--accent); transform: translateY(-10px); }

        .nav {
            position: fixed; top: 0; width: 100%; padding: 2rem;
            display: flex; justify-content: space-between; z-index: 100;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <canvas id="webgl"></canvas>

    <div class="cloud-container">
        <div class="blob blob-1" id="blob1"></div>
        <div class="blob blob-2" id="blob2"></div>
        <div class="blob blob-3" id="blob3"></div>
    </div>

    <nav class="nav">
        <div class="font-black text-xl tracking-tighter uppercase">GP<span class="text-accent">.</span></div>
        <div class="text-[10px] uppercase tracking-[0.4em] font-bold opacity-50">Kyiv Syndicate</div>
    </nav>

    <main>
        <section class="hero">
            <h1 class="hero-title">ETIKETKA<br>GP<span class="text-accent">.</span></h1>
        </section>

        <section class="bento-section">
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-12 mb-10 text-center">
                    <a href="mailto:etiketagp@gmail.com" class="text-5xl md:text-8xl font-black uppercase tracking-tighter hover:text-accent transition-colors">
                        etiketagp@gmail.com
                    </a>
                </div>
                
                <a href="tel:0632686842" class="bento-card md:col-span-5">
                    <span class="text-[10px] uppercase tracking-widest opacity-30">Primary Line</span>
                    <div class="text-4xl font-black">063 268 68 42</div>
                </a>

                <div class="bento-card md:col-span-7">
                    <span class="text-[10px] uppercase tracking-widest opacity-30">Nodes</span>
                    <div class="flex gap-4 mt-10">
                        <a href="#" class="flex-1 py-5 bg-white/5 rounded-2xl text-center font-bold hover:bg-white hover:text-black transition-all">TELEGRAM</a>
                        <a href="#" class="flex-1 py-5 bg-white/5 rounded-2xl text-center font-bold hover:bg-white hover:text-black transition-all">VIBER</a>
                    </div>
                </div>

                <div class="bento-card md:col-span-12">
                    <span class="text-[10px] uppercase tracking-widest opacity-30">Location</span>
                    <div class="text-4xl font-black mt-4 uppercase">Kyiv, Ukraine / Global HQ</div>
                </div>
            </div>
        </section>
    </main>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uTime;
        uniform vec2 uMouse;
        void main() {
            vNormal = normal;
            vec3 pos = position;
            float noise = sin(pos.x * 2.0 + uTime) * cos(pos.y * 2.0 + uTime) * 0.2;
            pos += normal * noise;
            float dist = distance(uMouse, pos.xy * 0.2);
            if(dist < 1.0) { pos += normal * (1.0 - dist) * 0.5; }
            vPosition = pos;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uTime;
        void main() {
            vec3 viewDirection = normalize(vec3(0, 0, 5) - vPosition);
            float fresnel = pow(1.0 - dot(viewDirection, vNormal), 3.0);
            vec3 color = mix(vec3(0.02), vec3(1.0, 0.2, 0.0), fresnel);
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        // Smooth Scroll
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        // Three.js (Плюшка)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#webgl'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const geometry = new THREE.IcosahedronGeometry(2.2, 64);
        const material = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector2(0, 0) } }
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        camera.position.z = 5;

        // Mouse & Cursor
        window.addEventListener('mousemove', (e) => {
            const mx = (e.clientX / window.innerWidth) * 2 - 1;
            const my = -(e.clientY / window.innerHeight) * 2 + 1;
            gsap.to(material.uniforms.uMouse.value, { x: mx * 2, y: my * 2, duration: 0.5 });
            gsap.to('#cursor', { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // Анімація хмар (Блобів)
        function moveBlob(id) {
            gsap.to(id, {
                x: `random(-15, 15)vw`,
                y: `random(-15, 15)vh`,
                duration: `random(10, 20)`,
                ease: "sine.inOut",
                onComplete: () => moveBlob(id)
            });
        }
        moveBlob('#blob1');
        moveBlob('#blob2');
        moveBlob('#blob3');

        // Loop
        const clock = new THREE.Clock();
        function animate() {
            material.uniforms.uTime.value = clock.getElapsedTime();
            mesh.rotation.y += 0.005;
            const scrollY = window.scrollY;
            mesh.position.y = -scrollY * 0.005;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
