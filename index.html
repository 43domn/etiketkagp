<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Etiketka GP | Interactive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
            pointer-events: none; box-sizing: border-box;
        }
        .header { display: flex; justify-content: space-between; }
        h1 { font-size: 8vw; margin: 0; letter-spacing: -0.05em; pointer-events: auto; }
        .footer { font-size: 12px; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <div>ETIKETKA GP</div>
            <div>MENU //////</div>
        </div>
        <div>
            <h1>PRECISION<br>IN PRINT</h1>
        </div>
        <div class="footer">SCROLL TO INTERACT // 2026</div>
    </div>

    <script>
        // Инициализация сцены
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Создание частиц (эффект Active Theory)
        const geometry = new THREE.BufferGeometry();
        const count = 2000;
        const positions = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) positions[i] = (Math.random() - 0.5) * 10;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0xffffff });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 5;

        // Интерактивность с мышью
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.001;
            points.rotation.x += mouseY * 0.05;
            points.rotation.y += mouseX * 0.05;
            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
